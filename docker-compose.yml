# ขึ้นทั้งสแตกด้วยคำสั่งเดียว:  docker compose up --build
# ตอนนี้มีแค่ db กับ backend ส่วน frontend จะเพิ่มทีหลัง

services:
  db:
    image: postgres:16-alpine
    container_name: lebis_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lebis}
    ports:
      # ซ้าย = พอร์ตบนเครื่องเรา / ขวา = พอร์ตใน container
      # ใช้ 5433 เพราะเครื่องคนทำมี postgres ตัวอื่นจอง 5432 อยู่แล้ว
      # ต่อจาก DBeaver/TablePlus ให้ใช้ localhost:5433
      - "5433:5432"
    volumes:
      - lebis_pgdata:/var/lib/postgresql/data
    healthcheck:
      # เช็กว่า postgres พร้อมรับ connection จริงๆ ไม่ใช่แค่ container เริ่มแล้ว
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lebis}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build: ./backend
    container_name: lebis_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # map โค้ดเข้าไปใน container เพื่อให้ --reload เห็นไฟล์ที่เราแก้
      - ./backend:/app
    depends_on:
      db:
        # รอจน healthcheck ของ db ผ่านก่อนค่อยสตาร์ท backend
        # ถ้าไม่ใส่บรรทัดนี้ backend จะตายตอนบูตเพราะ db ยังไม่พร้อม
        condition: service_healthy

volumes:
  lebis_pgdata:

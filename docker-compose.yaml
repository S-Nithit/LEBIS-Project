services:
  nextjs:
    build:
      context: ./nextjs
    ports:
      - "3000:3000"
    volumes:
      - ./nextjs:/src
      - /src/node_modules
    working_dir: /src
    command: npm run dev
    depends_on:
      - backend-api

  db:
    image: postgres:13
    ports:
      # ซ้าย = พอร์ตบนเครื่องเรา / ขวา = พอร์ตใน container
      # ใช้ 5433 เพราะเครื่องคนทำมี postgres ตัวอื่นจอง 5432 อยู่แล้ว
      # ข้างในเครือข่าย compose ยังคุยกันที่ db:5432 เหมือนเดิม (POSTGRES_HOST=db)
      - "5433:5432"
    environment:
      POSTGRES_USER: temp
      POSTGRES_PASSWORD: temp
      POSTGRES_DB: advcompro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temp -d advcompro"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-api:
    build:
      context: ./backend-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend-api:/src
    environment:
      POSTGRES_USER: temp
      POSTGRES_PASSWORD: temp
      POSTGRES_DB: advcompro
      POSTGRES_HOST: db
      # กุญแจที่ใช้เซ็น JWT — อ่านจากไฟล์ .env ที่อยู่ข้างๆ docker-compose.yaml
      # ไฟล์ .env ไม่ขึ้น git (ดู .gitignore) ห้ามเขียนค่าจริงลงในไฟล์นี้
      # ยังไม่มี .env ให้ทำตามหัวข้อ "วิธีติดตั้งและรัน" ใน README
      JWT_SECRET: ${JWT_SECRET}
      # ใส่บัญชีทดสอบให้อัตโนมัติ — ใช้ได้เฉพาะตอนรันในเครื่อง
      # ตอน deploy ขึ้น Railway ต้องตั้งเป็น false (ดู docs/deployment.md)
      SEED_DEMO_ACCOUNTS: "true"
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
